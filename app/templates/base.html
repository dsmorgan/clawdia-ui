<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Clawdia{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-ws@2.0.2/ws.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        surface: { DEFAULT: '#0a0a0f', light: 'rgba(255,255,255,0.05)', border: 'rgba(255,255,255,0.08)' },
                        accent: { DEFAULT: '#4f8ef7', glow: 'rgba(79,142,247,0.3)' },
                        ai: { DEFAULT: '#8b5cf6', glow: 'rgba(139,92,246,0.3)' },
                    }
                }
            }
        }
    </script>
    <style>
        /* --- Background ambient orbs --- */
        .bg-orbs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .orb {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15;
            animation: orb-drift 20s ease-in-out infinite alternate;
        }
        .orb-1 { width: 400px; height: 400px; background: #4f8ef7; top: -100px; left: -100px; animation-delay: 0s; }
        .orb-2 { width: 350px; height: 350px; background: #8b5cf6; bottom: -80px; right: -80px; animation-delay: -7s; }
        .orb-3 { width: 300px; height: 300px; background: #4f8ef7; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -14s; }
        @keyframes orb-drift {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.05); }
            66% { transform: translate(-20px, 30px) scale(0.95); }
            100% { transform: translate(10px, 10px) scale(1.02); }
        }

        /* --- Glass panel --- */
        .glass {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* --- Message animations --- */
        @keyframes slide-up-fade {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-enter { animation: slide-up-fade 0.3s ease-out forwards; }

        /* --- Send button pulse --- */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 8px rgba(79,142,247,0.4); }
            50% { box-shadow: 0 0 20px rgba(79,142,247,0.7); }
        }
        .btn-pulse { animation: pulse-glow 1.5s ease-in-out infinite; }

        /* --- Typing indicator --- */
        @keyframes typing-bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-4px); opacity: 1; }
        }
        .typing-dot { animation: typing-bounce 1.4s ease-in-out infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        /* --- Working spinner --- */
        @keyframes spin { to { transform: rotate(360deg); } }
        .working-spinner { animation: spin 0.8s linear infinite; }

        /* --- Shimmer hover for pills --- */
        .pill-shimmer {
            position: relative; overflow: hidden;
        }
        .pill-shimmer::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            transition: left 0.5s ease;
        }
        .pill-shimmer:hover::after { left: 100%; }

        /* --- Sidebar active border --- */
        .sidebar-item {
            border-left: 3px solid transparent; transition: border-color 0.3s ease, background 0.2s ease;
        }
        .sidebar-item:hover, .sidebar-item.active {
            border-left-color: #4f8ef7; background: rgba(79,142,247,0.08);
        }

        /* --- Input glow on focus --- */
        .input-glow:focus {
            box-shadow: 0 0 0 2px rgba(79,142,247,0.3);
            border-color: rgba(79,142,247,0.5);
        }

        /* --- Scrollbar styling --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* --- Copy button --- */
        .copy-btn { opacity: 0; transition: opacity 0.2s; }
        .msg-bubble:hover .copy-btn { opacity: 1; }

        /* --- Mobile drawer --- */
        .sidebar-overlay {
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
        .sidebar-drawer {
            transform: translateX(-100%); transition: transform 0.3s ease;
        }
        .sidebar-drawer.open { transform: translateX(0); }

        /* Full viewport height with dvh fallback */
        .h-dvh { height: 100vh; height: 100dvh; }

        /* Quick actions horizontal scroll */
        .quick-scroll { overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
        .quick-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-surface text-gray-200 font-sans h-dvh overflow-hidden">
    <!-- Background orbs -->
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    {% block body %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
